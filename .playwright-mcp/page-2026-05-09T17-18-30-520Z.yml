                      - paragraph [ref=e560]: 类比理解
                      - paragraph [ref=e561]: 电机就像一群推秋千的人——定子绕组通电后产生磁极（"手"），转子带着永磁体（"秋千"）被周期性地往同一个方向推。FOC 要解决的核心问题就是"什么时候推、推多大力"，让秋千越荡越快、越荡越稳。
                    - generic [ref=e562]:
                      - paragraph [ref=e563]: 核心一句话
                      - paragraph [ref=e564]: FOC 控制的所有数学，都建立在"机械角度 → 乘极对数 → 电角度 → 控制磁场方向"这条最基础的链条上。
                    - generic [ref=e565]:
                      - paragraph [ref=e566]: 为什么需要学
