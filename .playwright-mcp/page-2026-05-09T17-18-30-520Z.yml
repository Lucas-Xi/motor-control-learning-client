                        - listitem [ref=e568]: · 极对数搞错，电角度就会差几倍，电机会抖动甚至反转——是 FOC 上电就转不动的最常见原因。
                        - listitem [ref=e569]: · 机械角度（你眼睛看到转子转的角度）和电角度（控制器算法用的角度）是两个量，不能混用。
