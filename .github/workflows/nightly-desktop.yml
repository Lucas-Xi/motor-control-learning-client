name: Nightly Desktop Pack / 每夜桌面打包

# 触发：每日 UTC 18:00 (北京 02:00) + 手动触发
# Trigger: daily at UTC 18:00 (Asia/Shanghai 02:00) + manual dispatch
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack:
    name: Build + Electron Pack / 构建并打包 Windows 客户端
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo / 检出仓库
        uses: actions/checkout@v4

      - name: Setup Node 22 / 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps / 安装依赖 (npm ci)
        run: npm ci

      # electron ≥42 不再用 postinstall 自动下载二进制（package.json 无 scripts），
      # 必须显式跑 install-electron，否则 node_modules/electron/dist 缺失、打包失败。
      # electron ≥42 no longer auto-downloads via postinstall; run install-electron explicitly.
      - name: Download Electron binary / 下载 Electron 二进制
        run: npx install-electron

      - name: Build / 生产构建 (vite build)
        run: npm run build

      - name: Pack Electron / 打包 Electron 免安装目录
        run: npm run desktop:pack

      - name: Zip win-unpacked / 压缩免安装目录为 zip
        shell: pwsh
        run: |
          $zipName = "compbench-${{ github.run_number }}-windows-latest.zip"
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath $zipName -Force
          Write-Host "Created $zipName"

      - name: Upload artifact / 上传 zip 工件
        uses: actions/upload-artifact@v4
        with:
          name: compbench-${{ github.run_number }}-windows-latest
          path: compbench-${{ github.run_number }}-windows-latest.zip
          if-no-files-found: error
          retention-days: 7

      # 备注：不发到 GitHub Release，避免误发；如需正式发布请单独写 release.yml 并配置 GH_TOKEN
      # NOTE: This job does NOT publish to GitHub Releases. Add a separate release.yml + GH_TOKEN if needed.
