name: PR CI / PR 持续集成

# 触发：所有指向 main 的 pull_request
# Trigger: any pull_request targeting main
on:
  pull_request:
    branches: [main]

# 同一 PR 内的新提交会取消旧的运行，节省 Actions 时间
# Cancel in-progress runs for the same PR to save CI minutes
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Type-check / Unit / Build / 静态校验 + 编译 + 单测 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo / 检出仓库
        uses: actions/checkout@v4

      - name: Setup Node 22 / 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules / 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install deps / 安装依赖 (npm ci)
        run: npm ci

      - name: Verify project layout / 项目结构静态校验 (npm run verify)
        run: npm run verify

      - name: Verify fault waves / 故障波形回归
        run: node scripts/verify-fault-waves.mjs

      - name: TypeScript type-check / TS 类型检查 (tsc -b --noEmit)
        run: npx tsc -b --noEmit

      - name: Unit tests / 单元测试 (vitest)
        run: npx vitest run

      - name: Build / 生产构建 (vite build)
        run: npm run build

      # 备注：e2e (Playwright) 在 release-audit.yml 里跑，PR CI 控制在 5 分钟内
      # NOTE: e2e (Playwright) runs in release-audit.yml; PR CI targets <5 min
