name: Release Audit / 发布审计

# 触发：推送到 main + 手动触发
# Trigger: push to main + manual workflow_dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Verify + Build + E2E / 完整发布前审计
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo / 检出仓库
        uses: actions/checkout@v4

      - name: Setup Node 22 / 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache node_modules / 缓存 node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-

      - name: Install deps / 安装依赖 (npm ci)
        run: npm ci

      - name: Verify project layout / 项目结构静态校验
        run: npm run verify

      - name: Verify fault waves / 故障波形回归
        run: node scripts/verify-fault-waves.mjs

      - name: TypeScript type-check / TS 类型检查
        run: npx tsc -b --noEmit

      - name: Unit tests / 单元测试 (vitest)
        run: npx vitest run

      - name: Build / 生产构建 (vite build)
        run: npm run build

      - name: Install Playwright Chromium / 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: Run e2e (Playwright) / 端到端冒烟
        run: npx playwright test

      - name: Upload Playwright artifacts / 上传 e2e 工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compbench-${{ github.run_number }}-${{ runner.os }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      # 备注：如果未来要发 GitHub Release，需要在仓库 Settings → Secrets 配置 GH_TOKEN
      # NOTE: To publish a GitHub Release later, configure GH_TOKEN secret in repo Settings
